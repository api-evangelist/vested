aid: vested
name: Vested
description: >-
  Vested Finance is an investment platform that enables Indian residents to build globally
  diversified portfolios by investing in US markets. It provides access to 10,000+ US stocks
  and 2,000+ ETFs, professionally managed portfolios (Vests), global mutual funds spanning 50+
  countries, and private-market opportunities, alongside INR-to-USD remittance handling and
  US tax-reporting tools for Indian investors. Vested also operates a login-gated Partner API
  developer portal at developer.vestedfinance.com that exposes its brokerage and investing
  capabilities to partners. The company was originally surfaced as a portfolio company of
  Techstars and is profiled in the API Evangelist network.
